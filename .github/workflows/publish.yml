name: publish
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.13.6'
          python-version: '3.12'
      - name: Verify release tag
        run: test "$GITHUB_REF_NAME" = "v$(uv version --short)"
      - run: uv sync --locked --extra mcp
      - run: uv run --locked --extra mcp pytest
      - run: uv run --locked --extra mcp ruff check
      - run: uv run --locked --extra mcp ruff format --check
      - run: uv run --locked --extra mcp ty check
      - run: uv build
      - run: uv run --no-project --python 3.12 --with dist/*.whl scripts/check_package.py
      - run: uv run --no-project --python 3.12 --with dist/*.tar.gz scripts/check_package.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: distributions
          path: dist/
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/cosplay2py
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: distributions
          path: dist/
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.13.6'
      - run: uv publish --trusted-publishing always dist/*
