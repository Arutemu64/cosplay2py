name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13', '3.14', '3.15']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.13.6'
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run --locked pytest
      - run: uv run --locked ruff check
      - run: uv run --locked ruff format --check
      - run: uv run --locked ty check
  lower-bounds:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.13.6'
      - run: uv run --python 3.12 --resolution lowest-direct pytest
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.13.6'
      - run: uv build
      - run: uv venv .package-venv --python 3.12
      - run: uv pip install --python .package-venv/bin/python dist/*.whl
      - run: .package-venv/bin/python scripts/check_package.py
      - run: uv pip install --python .package-venv/bin/python --reinstall dist/*.tar.gz
      - run: .package-venv/bin/python scripts/check_package.py
