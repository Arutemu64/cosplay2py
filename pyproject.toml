[project]
name = "cosplay2py"
version = "0.5.0"
description = "Unofficial typed sync and async client for the Cosplay2.ru API"
readme = "README.md"
authors = [
    { name = "Arutemu64", email = "arutemu64@outlook.com" }
]
license = "MIT"
license-files = ["LICENSE"]
keywords = [
    "cosplay2",
    "cosplay",
    "events",
    "api",
    "client",
    "async",
    "typed",
    "pydantic",
    "httpx2",
    "mcp",
    "fastmcp",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Framework :: AnyIO",
    "Framework :: Pydantic :: 2",
    "Typing :: Typed",
]
requires-python = ">=3.12"
# Lower bounds only: they are the oldest versions the test suite passes with
# (`uv run --python 3.12 --resolution lowest-direct pytest`).
dependencies = [
    "anyio>=4.0.0",
    "httpx2>=2.0.0",
    "pydantic>=2.4.0",
]

[project.urls]
Homepage = "https://github.com/Arutemu64/cosplay2py"
Repository = "https://github.com/Arutemu64/cosplay2py"
Issues = "https://github.com/Arutemu64/cosplay2py/issues"

[project.optional-dependencies]
mcp = [
    "fastmcp>=4.0.0,<5",
]

[project.scripts]
cosplay2py-mcp = "cosplay2py.mcp:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
audit = [
    "pip-audit>=2.10.1",
]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
    # Pre-1.0: releases can change diagnostics, so pin exactly.
    "ty==0.0.94",
    "trio>=0.26",
    "prek>=0.5.7",
    "pytest-cov>=7.1.0",
]

[tool.pytest]
strict = true
testpaths = ["tests"]
# Live tests hit the real site; run them explicitly with `pytest -m live`.
addopts = [
    "-m",
    "not live",
    "--cov=cosplay2py",
    "--cov-report=term-missing",
    "--cov-fail-under=80",
]
markers = [
    "live: calls the real Cosplay2 API (needs COSPLAY2_API_KEY, COSPLAY2_API_SECRET, COSPLAY2_BASE_URL)",
]

[tool.coverage.run]
branch = true
source = ["src/cosplay2py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]

[tool.ruff]
line-length = 88
src = ["src", "tests"]
extend-exclude = [".agents", ".claude"]

[tool.ruff.lint]
# Keep Ruff's curated default rule set (`select` would replace it) and add more.
extend-select = [
    "I",     # isort
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "SIM",   # flake8-simplify
    "C4",    # flake8-comprehensions
    "PIE",   # flake8-pie
    "RET",   # flake8-return
    "PT",    # flake8-pytest-style
    "PTH",   # flake8-use-pathlib
    "ASYNC", # flake8-async
    "DTZ",   # flake8-datetimez
    "N",     # pep8-naming
    "RUF",   # ruff-specific rules
    "TID",   # flake8-tidy-imports
]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.isort]
known-first-party = ["cosplay2py"]

[tool.ruff.format]
docstring-code-format = true
line-ending = "lf"

[tool.ty.environment]
python-version = "3.12"

[tool.ty.rules]
possibly-unresolved-reference = "error"
unused-ignore-comment = "warn"

[tool.ty.src]
include = ["src", "tests"]

[tool.ty.terminal]
error-on-warning = true
